syntax = "proto3";

package padpilot.bridge;

option optimize_for = LITE_RUNTIME;

import "fx-chain.proto";

message ModuleSummary {
  string id = 1;
  string name = 2;
  string version = 3;
  repeated string capabilities = 4;
  string load_status = 5;
  string ui_entry_path = 6;
  string script_entry_path = 7;
  string load_error_message = 8;
  string expected_module_version = 9;
  string resolved_module_version = 10;
}

message PresetSummary {
  string id = 1;
  string name = 2;
}

enum InputDeviceKind {
  INPUT_DEVICE_KIND_UNKNOWN = 0;
  INPUT_DEVICE_KIND_GAMEPAD = 1;
}

enum ControllerLayoutKind {
  CONTROLLER_LAYOUT_KIND_AUTO = 0;
  CONTROLLER_LAYOUT_KIND_XBOX = 1;
  CONTROLLER_LAYOUT_KIND_PLAYSTATION = 2;
  CONTROLLER_LAYOUT_KIND_SWITCH = 3;
  CONTROLLER_LAYOUT_KIND_GENERIC = 4;
  CONTROLLER_LAYOUT_KIND_CUSTOM = 5;
}

enum ControllerBindingKind {
  CONTROLLER_BINDING_KIND_NONE = 0;
  CONTROLLER_BINDING_KIND_BUTTON = 1;
  CONTROLLER_BINDING_KIND_AXIS_POSITIVE = 2;
  CONTROLLER_BINDING_KIND_AXIS_NEGATIVE = 3;
}

message ControllerButtonBinding {
  ControllerBindingKind binding_kind = 1;
  uint32 source_index = 2;
  float threshold = 3;
}

message ControllerAxisBinding {
  uint32 source_index = 1;
  bool inverted = 2;
}

message CustomControllerLayout {
  string id = 1;
  string name = 2;
  repeated ControllerButtonBinding button_bindings = 3;
  repeated ControllerAxisBinding axis_bindings = 4;
}

message ControllerConfigRow {
  string stable_id = 1;
  string hardware_id = 2;
  ControllerLayoutKind layout_kind = 3;
  string custom_layout_id = 4;
  bool is_primary = 5;
}

message ControllerConfigState {
  repeated ControllerConfigRow rows = 1;
  repeated CustomControllerLayout custom_layouts = 2;
}

message InputDeviceState {
  string device_id = 1;
  InputDeviceKind device_kind = 2;
  string display_name = 3;
  bool connected = 4;
  uint32 frame_index = 5;
  repeated float axes = 6;
  repeated float buttons = 7;
  string runtime_device_id = 8;
  string hardware_id = 9;
  repeated float raw_axes = 10;
  repeated float raw_buttons = 11;
  ControllerLayoutKind detected_layout_kind = 12;
  ControllerLayoutKind active_layout_kind = 13;
}

message HostSyncFrame {
  repeated ModuleSummary modules = 1;
  repeated PresetSummary presets = 2;
  string selected_module_id = 3;
  string selected_preset_id = 4;
  bytes active_module_state = 5;
  uint64 accepted_revision = 6;
  bool controller_connected = 7;
  uint32 controller_frame_index = 8;
  repeated float controller_axes = 9;
  repeated float controller_buttons = 10;
  repeated EditorViewStateEntry editor_view_states = 11;
  repeated InputDeviceState input_devices = 12;
  float project_bpm = 13;
  ControllerConfigState controller_config = 14;
}

message NavigationFrame {
  repeated ModuleSummary modules = 1;
  repeated PresetSummary presets = 2;
  string selected_module_id = 3;
  string selected_preset_id = 4;
}

message ActiveModuleStateFrame {
  string module_id = 1;
  bytes payload = 2;
  uint64 accepted_revision = 3;
  float project_bpm = 4;
}

message InputStateFrame {
  bool controller_connected = 1;
  uint32 controller_frame_index = 2;
  repeated float controller_axes = 3;
  repeated float controller_buttons = 4;
  repeated InputDeviceState input_devices = 5;
  ControllerConfigState controller_config = 6;
}

message SetModuleStateRequest {
  string module_id = 1;
  bytes payload = 2;
  uint64 revision = 3;
}

message SetControllerConfigRequest {
  ControllerConfigState controller_config = 1;
}

message PresetSaveRequest {
  string name = 1;
  padpilot.fx.PresetFile preset = 2;
}

message PresetSelectRequest {
  string preset_id = 1;
}

message BridgeAck {
  string module_id = 1;
  uint64 accepted_revision = 2;
}

message ModuleStateEntry {
  string module_id = 1;
  bytes payload = 2;
  uint64 accepted_revision = 3;
}

message EditorViewStateEntry {
  string scope_id = 1;
  string payload_json = 2;
}

message ImportedMediaEntry {
  string module_id = 1;
  string category = 2;
  string content_id = 3;
  string source_name = 4;
  string managed_path = 5;
  bytes payload = 6;
}

enum AutomationValueKind {
  AUTOMATION_VALUE_KIND_FLOAT = 0;
  AUTOMATION_VALUE_KIND_BOOLEAN = 1;
}

enum AutomationTargetKind {
  AUTOMATION_TARGET_KIND_NONE = 0;
  AUTOMATION_TARGET_KIND_MASTER_INPUT_GAIN = 1;
  AUTOMATION_TARGET_KIND_MASTER_WET_DRY = 2;
  AUTOMATION_TARGET_KIND_MASTER_OUTPUT_GAIN = 3;
  AUTOMATION_TARGET_KIND_FX_CHAIN_MIX = 4;
  AUTOMATION_TARGET_KIND_FX_NODE_MIX = 5;
  AUTOMATION_TARGET_KIND_FX_NODE_PARAM_FLOAT = 6;
}

message AutomationBinding {
  uint32 slot_index = 1;
  string module_id = 2;
  uint32 chain_id = 3;
  uint32 node_id = 4;
  string control_key = 5;
  string display_name = 6;
  AutomationValueKind value_kind = 7;
  AutomationTargetKind target_kind = 8;
  uint32 parameter_id = 9;
  float min_value = 10;
  float max_value = 11;
}

message PluginState {
  uint32 schema_version = 1;
  repeated ModuleSummary modules = 2;
  repeated padpilot.fx.PresetFile presets = 3;
  repeated ModuleStateEntry module_states = 4;
  string selected_module_id = 5;
  string selected_preset_id = 6;
  repeated AutomationBinding automation_bindings = 7;
  repeated EditorViewStateEntry editor_view_states = 8;
  repeated ImportedMediaEntry imported_media = 9;
  ControllerConfigState controller_config = 10;
  repeated float parameter_values = 11;
}
