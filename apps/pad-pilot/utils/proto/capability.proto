syntax = "proto3";

package padpilot.capability;

option optimize_for = LITE_RUNTIME;

enum SampleAnalysisMode {
  SAMPLE_ANALYSIS_MODE_AUTO = 0;
  SAMPLE_ANALYSIS_MODE_BPM = 1;
  SAMPLE_ANALYSIS_MODE_CUSTOM = 2;
}

enum SampleBpmSource {
  SAMPLE_BPM_SOURCE_NONE = 0;
  SAMPLE_BPM_SOURCE_METADATA = 1;
  SAMPLE_BPM_SOURCE_ANALYZED = 2;
  SAMPLE_BPM_SOURCE_PROJECT = 3;
  SAMPLE_BPM_SOURCE_USER = 4;
}

message SampleSliceMarker {
  uint32 start_frame = 1;
  uint32 end_frame = 2;
  uint32 transient_frame = 3;
  float confidence = 4;
  uint32 pad_index = 5;
  uint32 choke_group_id = 6;
  float fade_ms = 7;
  bool snap_exact = 8;
}

message SamplePadAssignment {
  uint32 pad_index = 1;
  uint32 bank = 2;
  string face_button = 3;
  uint32 slice_index = 4;
  uint32 choke_group_id = 5;
  bool is_empty = 6;
}

message SampleChokeGroup {
  uint32 id = 1;
  string name = 2;
  uint32 accent_hue = 3;
}

message SampleSourceLoadRequest {
  string source_path = 1;
  string source_name = 2;
  string source_content_id = 3;
}

message SampleAnalysisRequest {
  uint32 waveform_window_size = 1;
  bool include_transient_slices = 2;
  SampleAnalysisMode analysis_mode = 3;
  float density = 4;
  float requested_bpm = 5;
  float project_bpm = 6;
  repeated SampleSliceMarker manual_markers = 7;
  uint32 max_slice_count = 8;
  bool include_candidate_transients = 9;
}

message SampleAnalysisResult {
  bool loaded = 1;
  float analysis_progress = 2;
  repeated float waveform_peaks = 3;
  repeated uint32 candidate_transients = 4;
  repeated SampleSliceMarker slice_markers = 5;
}

message SlicePlaybackState {
  string sample_handle = 1;
  float pitch_semitones = 2;
  float gain_db = 3;
  bool stretch_enabled = 4;
  bool granular_enabled = 5;
  float grain_size_ms = 6;
  float grain_density = 7;
  repeated SampleSliceMarker slice_markers = 8;
  repeated SamplePadAssignment pad_assignments = 9;
  repeated SampleChokeGroup choke_groups = 10;
  SampleAnalysisMode analysis_mode = 11;
  float density = 12;
  float bpm_value = 13;
  SampleBpmSource bpm_source = 14;
  float bpm_confidence = 15;
  float bpm_suggested_value = 16;
  float bpm_suggested_confidence = 17;
  uint64 manual_edit_revision = 18;
  float project_bpm = 19;
}

message SlicePlaybackTrigger {
  uint32 pad_index = 1;
  float velocity = 2;
  bool pressed = 3;
}

enum SliceEditType {
  SLICE_EDIT_TYPE_UNKNOWN = 0;
  SLICE_EDIT_TYPE_REANALYZE = 1;
  SLICE_EDIT_TYPE_NUDGE_MARKER = 2;
  SLICE_EDIT_TYPE_SET_PAD_ASSIGNMENT = 3;
  SLICE_EDIT_TYPE_SET_CHOKE_GROUP = 4;
  SLICE_EDIT_TYPE_SET_ANALYSIS_MODE = 5;
  SLICE_EDIT_TYPE_SET_BPM = 6;
  SLICE_EDIT_TYPE_SET_DENSITY = 7;
  SLICE_EDIT_TYPE_ADD_MARKER = 8;
  SLICE_EDIT_TYPE_MOVE_MARKER = 9;
  SLICE_EDIT_TYPE_DELETE_MARKER = 10;
  SLICE_EDIT_TYPE_REGENERATE_SLICES = 11;
}

message SliceEditIntent {
  SliceEditType type = 1;
  uint32 slice_index = 2;
  float delta_frames = 3;
  bool fine_mode = 4;
  SamplePadAssignment pad_assignment = 5;
  SampleChokeGroup choke_group = 6;
  SampleSliceMarker slice_marker = 7;
  SampleAnalysisMode analysis_mode = 8;
  float bpm_value = 9;
  float density = 10;
}

message HapticIntent {
  float low = 1;
  float high = 2;
  uint32 duration_ms = 3;
  string rate_limit_key = 4;
}

message SampleEditorFrame {
  uint64 sequence = 1;
  bool loaded = 2;
  float analysis_progress = 3;
  repeated float waveform_peaks = 4;
  repeated uint32 candidate_transients = 5;
  uint32 active_slice_index = 6;
  uint64 playhead_frame = 7;
  uint32 armed_pad_index = 8;
  bool last_snap_exact = 9;
  repeated SampleSliceMarker slice_markers = 10;
  repeated SamplePadAssignment pad_assignments = 11;
  SampleAnalysisMode analysis_mode = 12;
  float bpm_value = 13;
  SampleBpmSource bpm_source = 14;
  float bpm_confidence = 15;
  float bpm_suggested_value = 16;
  float bpm_suggested_confidence = 17;
  float density = 18;
  repeated uint32 held_pad_indices = 19;
  repeated uint32 playing_pad_indices = 20;
  float project_bpm = 21;
  uint64 analysis_revision = 22;
}

message CapabilityFrameEnvelope {
  string capability = 1;
  string handle = 2;
  uint64 sequence = 3;
  string payload_type = 4;
  bytes payload = 5;
}
