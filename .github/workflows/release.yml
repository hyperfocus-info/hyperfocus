name: Release applications

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check:process-policy
      - run: bun run test:repository
      - run: bun run check:repository-size
      - run: bun run typecheck
      - run: bun run test:packages
      - run: bun run test:harness
      - run: bun run build:editor
      - run: bun apps/harness/scripts/package-launcher.ts --target bun-windows-x64
      - id: harness-release
        run: bun apps/harness/scripts/launcher-release.ts --target bun-windows-x64
      - shell: pwsh
        run: Compress-Archive -Path apps/engine-editor/cli.ts,apps/engine-editor/server.ts,apps/engine-editor/server-utils.ts,apps/engine-editor/index.html,apps/engine-editor/styles.css,apps/engine-editor/dist,apps/engine-editor/wasm,LICENSE -DestinationPath hyperfocus-editor-windows-portable.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            hyperfocus-editor-windows-portable.zip
            ${{ steps.harness-release.outputs.artifact_path }}
          fail_on_unmatched_files: true
