syntax = "proto3";
package hyperfocus.serialization.benchmark;

// Experiment-only candidates. Not persisted production formats.
message Direction { double x = 1; double y = 2; double z = 3; }
message CombatInput {
  string match_id = 1; uint32 frame = 2; repeated string actions = 3;
  Direction direction = 4;
}
message StreamDelta {
  string request_id = 1; string assistant_id = 2; string session_id = 3; string delta = 4;
}
message StreamBatch { repeated StreamDelta events = 1; }
message StoredRecord { string id = 1; bytes value = 2; }
message Backup {
  string format = 1; uint32 version = 2; double created_at = 3; string checksum = 4;
  uint32 snapshot_version = 5; repeated StoredRecord players = 6;
  repeated StoredRecord rooms = 7; repeated bytes events = 8;
}
