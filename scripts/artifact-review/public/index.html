<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyperfocus · Review</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><a class="brand" href="/">HYPERFOCUS / REVIEW</a><h1 id="collection">Loading review…</h1></div><div class="tools"><span id="save-status" role="status">Connecting</span><button id="retry" hidden>Retry save</button><button id="reload" hidden>Load saved version</button></div></header>
<div class="layout"><aside><label for="search">Find an output</label><input id="search" type="search" placeholder="Search title or description"><nav id="items" aria-label="Outputs"></nav></aside>
<main><div class="heading"><p id="identity" class="muted"></p><h2 id="title"></h2><p id="description"></p></div>
<div class="workspace"><section class="preview" aria-label="Output preview"><div class="tools" style="margin-bottom:12px"><button id="previous">Previous</button><span id="position" aria-live="polite"></span><button id="next">Next</button></div><div id="media"></div><div class="tools quick-note"><button id="note-moment" class="primary">Note this moment</button><button id="finish-range">End selection here</button></div><div id="sections" class="tools" aria-label="Sections"></div><details id="about"><summary>Details</summary><article id="text"></article></details><p class="muted">Review this exact version. Your notes save automatically and stay linked to this asset version.</p></section>
<section class="feedback" aria-label="Feedback"><h3>Your take</h3><div id="grades" class="tools" aria-label="Overall grade"></div><label for="notes">Overall notes</label><textarea id="notes" rows="3" placeholder="What works? What should change?"></textarea><details><summary>Score individual qualities</summary><div id="scores"></div></details>
<section class="annotation-editor"><h3>Annotate a section</h3><p id="anchor-label" class="muted">Whole output</p><div id="time-controls"><div class="tools"><button id="mark-start">Start here</button><button id="mark-end">End here</button><button id="play-range">Play selection</button></div><div class="range"><label>Start (seconds)<input id="start" type="number" min="0" step="0.1" inputmode="decimal"></label><label>End (optional)<input id="end" type="number" min="0" step="0.1" inputmode="decimal"></label></div></div><label for="annotation-note">Section note</label><textarea id="annotation-note" rows="3" placeholder="Tell me what to keep, fix, or try here."></textarea><div class="tools"><button id="add-note" class="primary">Add note</button><button id="cancel-note" hidden>Cancel edit</button><button id="clear-anchor">Whole output</button></div><p id="annotation-error" role="alert"></p></section>
<details><summary>Version and feedback history</summary><div id="history"></div></details><h3 id="annotation-count">Section notes</h3><ol id="annotations"></ol></section></div></main></div><script type="module" src="/review.js"></script></body></html>
